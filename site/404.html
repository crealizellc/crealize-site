<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Crealize</title>
<meta name="robots" content="noindex" />
<!-- 色與字一律走契約。2026-08-09 之前這頁把 #F7F4EE / #6b6660 硬寫在 inline style，
     兩者都不是 token（--paper 是 #FAFAF8、次要文字是 --ink-55），而 token-drift-lint
     只掃 site/css/*，所以漂了也沒有任何 gate 會叫。改吃 tokens.css 後從結構上不可能再漂。 -->
<link rel="stylesheet" href="/css/tokens.css" />
<style>
  body { margin:0; min-height:100dvh; display:grid; place-content:center; gap:14px;
         background:var(--paper); color:var(--ink);
         font-family:var(--font-display); text-align:center; padding:0 24px; }
  h1 { font-size:clamp(56px,12vw,96px); margin:0; letter-spacing:-.02em; }
  p  { margin:0; color:var(--ink-55); font-family:var(--font-mono); font-size:var(--fs-sm); line-height:1.7; }
  a  { color:var(--accent-deep); }
</style>
</head>
<body>
  <h1>404</h1>
  <p>[err] this page never materialized · <a href="/">return to reality</a></p>
</body>
</html>
