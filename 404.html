<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Crealize</title>
<meta name="robots" content="noindex" />
<!-- 色與字一律走契約。2026-08-09 之前這頁把 #F7F4EE / #6b6660 硬寫在 inline style，
     兩者都不是 token（--paper 是 #FAFAF8、次要文字是 --ink-55），而 token-drift-lint
     只掃 site/css/*，所以漂了也沒有任何 gate 會叫。改吃 tokens.css 後從結構上不可能再漂。 -->
<link rel="stylesheet" href="/css/tokens.css" />
<style>
  body { margin:0; min-height:100dvh; display:grid; place-content:center; gap:14px;
         background:var(--paper); color:var(--ink);
         font-family:var(--font-display); text-align:center; padding:0 24px; }
  h1 { font-size:clamp(56px,12vw,96px); margin:0; letter-spacing:-.02em; }
  p  { margin:0; color:var(--ink-55); font-family:var(--font-mono); font-size:var(--fs-sm); line-height:1.7; }
  a  { color:var(--accent-deep); }
</style>
</head>
<body>
  <h1>404</h1>
  <!-- 三語同檔：GitHub Pages 對所有路徑只回這一份 404，無法依 /ja/ /zh/ 分流。
       預設顯示英文；下方腳本依路徑前綴切換 <html lang> 與可見段落。無 JS 時三段全部顯示。 -->
  <p lang="en" data-l="en">[err] this page never materialized · <a href="/">return to reality</a></p>
  <p lang="ja" data-l="ja" hidden>[err] このページは実体化しませんでした · <a href="/ja/">現実に戻る</a></p>
  <p lang="zh-Hant" data-l="zh" hidden>[err] 這個頁面沒有實現 · <a href="/zh/">回到現實</a></p>
  <noscript><style>p[data-l]{display:block}</style></noscript>
  <script>
    (function () {
      var m = /^\/(ja|zh)(\/|$)/.exec(location.pathname);
      if (!m) return;
      var l = m[1];
      document.documentElement.lang = l === 'zh' ? 'zh-Hant' : 'ja';
      document.title = l === 'ja' ? '404 — Crealize' : '404 — Crealize';
      var ps = document.querySelectorAll('p[data-l]');
      for (var i = 0; i < ps.length; i++) ps[i].hidden = ps[i].getAttribute('data-l') !== l;
    })();
  </script>
</body>
</html>
