<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crealize — Selected Work v3</title>
<style>
:root{
--paper:#FAFAF8;--paper-2:#F2F1EC;--ink:#121110;--ink-paper:#F6F5F1;
--ink-70:rgba(18,17,16,.70);--ink-55:rgba(18,17,16,.55);--ink-40:rgba(18,17,16,.40);--ink-25:rgba(18,17,16,.25);
--line:rgba(18,17,16,.14);--line-soft:rgba(18,17,16,.07);
--accent:#FF4F00;--accent-deep:#C03D00;
--display:'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
--serif:'Newsreader',Georgia,'Times New Roman',serif;
--mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
--jp:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','PingFang TC','Noto Sans TC',sans-serif;
--gutter:clamp(20px,4.4vw,88px);
--ec:cubic-bezier(.22,1,.36,1);--ei:cubic-bezier(.6,.04,.98,.34);
--d1:360ms;--d2:620ms;--d3:1100ms;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h2,h3{margin:0;font-weight:500;letter-spacing:-.02em;line-height:1.1}
p{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1440px;margin:0 auto;padding:clamp(40px,6vh,72px) var(--gutter) clamp(64px,10vh,120px)}

.sec-head{display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--ink);padding-top:16px}
.sec-head__idx{font-family:var(--mono);font-size:12px;color:var(--accent)}
.sec-head__kicker{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.02em}
.sec-head__count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-40)}

.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-top:clamp(20px,3vh,32px)}
.lede{font-family:var(--serif);font-style:italic;font-size:clamp(19px,1.6vw,25px);color:var(--ink-70);max-width:38ch;line-height:1.4}

.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;flex:none}
.lang button{appearance:none;border:0;background:transparent;font-family:var(--display);font-size:12px;font-weight:500;color:var(--ink-40);padding:6px 13px;border-radius:999px;cursor:pointer;transition:background var(--d1) var(--ec),color var(--d1) var(--ec)}
.lang button:nth-child(n+2){font-family:var(--jp)}
.lang button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.legend{display:flex;flex-wrap:wrap;gap:20px;margin:clamp(24px,3.4vh,36px) 0 clamp(20px,2.6vh,28px);padding-bottom:14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-40)}
.legend span{display:inline-flex;align-items:center;gap:7px}

.dot{width:7px;height:7px;border-radius:999px;flex:none}
.dot--live{background:var(--ink)}
.dot--dev{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.dot--ops{background:var(--accent)}

.plat{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.plat b{font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.05em;color:var(--ink-55);border:1px solid var(--line);border-radius:2px;padding:3px 6px}
.plat b.none{color:var(--ink-25);border-style:dashed}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(32px,3.4vw,52px) clamp(18px,2vw,32px)}
.card{display:flex;flex-direction:column;min-width:0}
.card__link{display:block;outline:none}

.stage{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--tint);border:1px solid var(--line-soft);transition:transform var(--d2) var(--ec)}
.card__link:hover .stage{transform:translateY(-3px)}
.stage__motif{position:absolute;inset:0}
.m{position:absolute;left:0;top:0;bottom:0;width:70%;height:100%;display:block;overflow:visible}
.stage[data-nophone="1"] .m{width:100%}
.stage[data-border="1"]{border:1px solid rgba(14,14,16,.14);box-shadow:none}
.stage__phone{position:absolute;right:6.5%;bottom:-14%;width:23%;aspect-ratio:9/19.5;border-radius:8px;background:var(--ink);padding:2px;
box-shadow:0 1px 0 rgba(255,255,255,.45) inset,-1px -1px 2px rgba(255,255,255,.30),0 1px 1px rgba(18,17,16,.20),0 6px 10px -4px rgba(18,17,16,.22),0 20px 34px -12px rgba(18,17,16,.30);
transition:transform var(--d2) var(--ec),box-shadow var(--d2) var(--ec)}
.card__link:hover .stage__phone{transform:translateY(-6px)}
/* fudeto + tendo brand rule: no drop shadow, no gradient */
.stage[data-flat="1"] .stage__phone{box-shadow:0 0 0 1px rgba(18,17,16,.16)}
.stage__phone i{display:block;width:100%;height:100%;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(-45deg,var(--paper-2) 0 1px,transparent 1px 9px),var(--paper)}
.stage__phone img{width:100%;height:100%;object-fit:cover;display:block}

.card__meta{margin-top:18px}
.card__name{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.02em}
.card__name em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card__jp{font-family:var(--jp);font-weight:400;font-size:11.5px;color:var(--ink-40);letter-spacing:.02em;margin-top:4px;display:block}
.card__pos{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink);margin-top:12px;line-height:1.35}
.card__body{font-family:var(--display);font-weight:400;font-size:13.5px;line-height:1.62;color:var(--ink-55);margin-top:10px;max-width:44ch}
.card__body b{font-weight:500;color:var(--ink-70)}
:root[data-lang="ja"] .card__body,:root[data-lang="zh"] .card__body,
:root[data-lang="ja"] .card__pos,:root[data-lang="zh"] .card__pos,
:root[data-lang="ja"] .lede,:root[data-lang="zh"] .lede{font-family:var(--jp);font-style:normal;line-height:1.75}
:root[data-lang="ja"] .card__pos,:root[data-lang="zh"] .card__pos{font-weight:500;font-size:15px}
:root[data-lang="ja"] .lede,:root[data-lang="zh"] .lede{font-weight:400;line-height:1.6}

.card{opacity:0;filter:blur(9px);transform:translateY(18px);transition:opacity var(--d3) var(--ec),filter var(--d3) var(--ec),transform var(--d3) var(--ec)}
.card.is-in{opacity:1;filter:none;transform:none}

/* ══════ motifs — each is the product's own core action ══════ */
.m *{transform-box:fill-box}
.m-vb{transform-box:view-box}
.m-draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}

/* puritylens — ingredient rows surface, then converge into a score dial */
.is-live .pl-row{animation:plRow var(--d2) var(--ec) both}
@keyframes plRow{0%{opacity:0;transform:translateX(-10px)}40%,62%{opacity:1;transform:none}100%{opacity:0;transform:translateX(26px) scale(.9)}}
.is-live .pl-dial{animation:draw var(--d3) var(--ec) both;animation-delay:var(--d2)}
.is-live .pl-ball{animation:plBall var(--d3) var(--ec) both}
@keyframes plBall{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}

/* fudeto — equiangular spiral self-draws in 800ms, ends on the gold point */
.is-live .fd-spiral{animation:draw 800ms var(--ec) both}
.is-live .fd-gold{animation:fdGold var(--d1) var(--ec) both;animation-delay:760ms}
@keyframes fdGold{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

/* kichitto — shutter press, receipt falls, becomes one ledger row */
.is-live .ki-fab{animation:kiFab var(--d1) var(--ec) both}
@keyframes kiFab{0%,18%{transform:scale(1)}34%{transform:scale(.86)}100%{transform:scale(1)}}
.is-live .ki-receipt{animation:kiFall var(--d3) var(--ec) both;animation-delay:var(--d1)}
@keyframes kiFall{0%{opacity:0;transform:translateY(-52px)}44%{opacity:1;transform:translateY(0)}80%,100%{opacity:0;transform:translateY(64px) scaleY(.24)}}
.is-live .ki-row{animation:kiRow var(--d2) var(--ec) both;animation-delay:1.16s;transform-origin:left center}
@keyframes kiRow{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:scaleX(1)}}

/* qiflux — the mark simply breathes */
.is-live .qf-breathe{animation:qfB 5.2s var(--ec) infinite}
@keyframes qfB{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.045);opacity:1}}

/* meishitto — card slides into the holder. 400ms ceiling, zero under reduce-motion */
.is-live .me-card{animation:meIn 400ms var(--ec) both}
@keyframes meIn{from{transform:translate(-46px,-26px) rotate(-7deg);opacity:0}to{transform:none;opacity:1}}
.is-live .me-row{animation:meRow var(--d1) var(--ec) both}
@keyframes meRow{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* rythix 2048 — slide → merge → sound, in that causal order */
.is-live .rx-a{animation:rxA 1.6s var(--ec) infinite}
@keyframes rxA{0%{transform:none}26%,100%{transform:translateX(56px)}}
.is-live .rx-b{animation:rxB 1.6s var(--ec) infinite}
@keyframes rxB{0%,26%{opacity:0;transform:scale(.6)}34%{opacity:1;transform:scale(1.08)}44%,100%{opacity:1;transform:scale(1)}}
.is-live .rx-bar{animation:rxBar 1.6s var(--ec) infinite}
.rx-bar{transform-origin:left bottom}
@keyframes rxBar{0%,34%{transform:scaleY(.12)}46%{transform:scaleY(1)}70%,100%{transform:scaleY(.18)}}

/* tendo — Magic Moment: vertices light in visit order across 2.4s */
.is-live .td-path{animation:draw 2.4s linear both}
.is-live .td-node{animation:tdNode var(--d1) var(--ec) both}
@keyframes tdNode{from{fill-opacity:.16}to{fill-opacity:1}}

/* xunni — the shell breathes; the lens switches and the radar re-reads */
.is-live .xn-shell{animation:xnShell 6s var(--ec) infinite}
@keyframes xnShell{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.9;transform:scale(1.03)}}
.is-live .xn-r1{animation:xnR1 4.8s var(--ec) infinite}
@keyframes xnR1{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
.is-live .xn-r2{animation:xnR2 4.8s var(--ec) infinite}
@keyframes xnR2{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.is-live .xn-lens{animation:xnLens 4.8s steps(1) infinite}
@keyframes xnLens{0%,44%{transform:none}50%,94%{transform:translateX(26px)}100%{transform:none}}

/* moonpacket — the flap lifts and the reward comes out */
.is-live .mp-flap{animation:mpFlap var(--d3) var(--ec) both}
@keyframes mpFlap{0%{transform:rotateX(0)}55%,100%{transform:rotateX(-158deg)}}
.is-live .mp-coin{animation:mpCoin var(--d3) var(--ec) both;animation-delay:var(--d1)}
@keyframes mpCoin{from{opacity:0;transform:translateY(16px) scale(.7)}to{opacity:1;transform:translateY(-64px) scale(1)}}

/* idokuta — your words dissolve into medical Japanese, then you hand the phone over */
.is-live .id-src{animation:idSrc var(--d2) var(--ec) both}
@keyframes idSrc{0%{opacity:1;filter:blur(0)}100%{opacity:0;filter:blur(4px)}}
.is-live .id-ja{animation:idJa var(--d2) var(--ec) both;animation-delay:var(--d1)}
@keyframes idJa{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
.is-live .id-card{animation:idPass var(--d3) var(--ec) both;animation-delay:var(--d2)}
@keyframes idPass{from{transform:none}to{transform:translateX(34px)}}
.is-live .id-hand{animation:idHand var(--d3) var(--ec) both;animation-delay:var(--d2)}
@keyframes idHand{from{transform:translateX(22px);opacity:.35}to{transform:none;opacity:1}}

/* mairi — the record passes through the gate, then the gate closes at six hours */
.is-live .mr-line{animation:draw var(--d3) var(--ec) both}
.is-live .mr-qr{animation:mrQR 5.6s var(--ec) infinite}
@keyframes mrQR{0%,8%{opacity:0;transform:scale(.8)}18%,62%{opacity:1;transform:none}82%,100%{opacity:0;transform:scale(.92)}}
.is-live .mr-timer{animation:mrTimer 5.6s linear infinite}
@keyframes mrTimer{0%,18%{stroke-dashoffset:0}72%,100%{stroke-dashoffset:var(--len)}}

/* meguru — one closed loop, flowing; magenta only at the nodes */
.is-live .mg-loop{animation:mgFlow 4.4s linear infinite}
@keyframes mgFlow{to{stroke-dashoffset:-88}}
.is-live .mg-node{animation:mgNode 4.4s var(--ec) infinite}
@keyframes mgNode{0%,72%,100%{opacity:.34}80%{opacity:1}}

@media (prefers-reduced-motion:reduce){
.card{opacity:1;filter:none;transform:none}
.m *,.is-live .m *{animation:none!important}
.m-draw{stroke-dashoffset:0}
.mp-flap{transform:rotateX(-158deg)}
}

@media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
.grid{grid-template-columns:1fr;gap:44px}
.intro{align-items:flex-start}
.card__pos{font-size:15px}
.stage__phone{width:26%}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="sec-head">
    <span class="sec-head__idx">02</span>
    <h2 class="sec-head__kicker">Selected Work / 制作実績</h2>
    <span class="sec-head__count">12 products</span>
  </div>

  <div class="intro">
    <p class="lede" id="lede"></p>
    <div class="lang" role="tablist" aria-label="Language">
      <button role="tab" data-l="en" aria-selected="true">EN</button>
      <button role="tab" data-l="ja" aria-selected="false">日本語</button>
      <button role="tab" data-l="zh" aria-selected="false">繁體中文</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
(function(){
"use strict";

var LEDE={
en:"Twelve products. Each one is a mechanism we thought should exist — so we built the smallest honest version of it and shipped.",
ja:"12のプロダクト。どれも「この仕組みはあるべきだ」という一点から始め、いちばん小さくて誠実な形にして世に出しました。",
zh:"十二個產品。每一個都始於「這個機制應該存在」，然後做成最小、也最誠實的那個版本，送出去。"};

var LEGEND={
en:[["live","shipped"],["dev","in development"],["ops","in operation"]],
ja:[["live","公開中"],["dev","開発中"],["ops","運営中"]],
zh:[["live","已上線"],["dev","開發中"],["ops","營運中"]]};

/* ── motifs: authored from each product's real mechanism ── */
var M={
puritylens:'<svg class="m" viewBox="0 0 320 240"><defs><radialGradient id="plB" cx="34%" cy="30%" r="74%"><stop offset="0" stop-color="#fff"/><stop offset=".38" stop-color="#DCEAF2"/><stop offset="1" stop-color="#7BB8D4"/></radialGradient></defs>'
+'<g class="pl-ball m-vb" style="transform-origin:112px 120px"><circle cx="112" cy="120" r="66" fill="url(#plB)"/><circle cx="90" cy="98" r="15" fill="#fff" opacity=".72"/></g>'
+'<g fill="#7BB8D4"><rect class="pl-row" x="186" y="70" width="104" height="9" rx="2"/><rect class="pl-row" style="animation-delay:80ms" x="186" y="92" width="82" height="9" rx="2" opacity=".72"/><rect class="pl-row" style="animation-delay:160ms" x="186" y="114" width="96" height="9" rx="2" opacity=".54"/><rect class="pl-row" style="animation-delay:240ms" x="186" y="136" width="68" height="9" rx="2" opacity=".38"/></g>'
+'<circle class="pl-dial m-draw m-vb" style="--len:396" cx="112" cy="120" r="84" fill="none" stroke="#4E8FB0" stroke-width="7" stroke-linecap="round" transform="rotate(-90 112 120)"/></svg>',

fudeto:'<svg class="m" viewBox="0 0 320 240"><path class="fd-spiral m-draw" style="--len:820" d="M300 44 C230 6 128 14 76 68 C24 122 34 196 96 214 C158 232 214 190 206 146 C198 102 148 92 128 118 C108 144 126 172 150 168 C168 165 174 148 164 138" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/><circle class="fd-gold m-vb" cx="164" cy="138" r="9" fill="#EAB308" style="transform-origin:164px 138px"/></svg>',

kichitto:'<svg class="m" viewBox="0 0 320 240"><g class="ki-receipt"><path d="M40 26 L56 16 L72 26 L88 16 L104 26 L120 16 L136 26 L136 130 L40 130 Z" fill="#E97B47"/><rect x="54" y="48" width="68" height="7" fill="#FAFAF8"/><rect x="54" y="68" width="44" height="7" fill="#FAFAF8"/><rect x="54" y="88" width="68" height="7" fill="#FAFAF8"/></g>'
+'<rect class="ki-row" x="40" y="176" width="176" height="26" rx="2" fill="#E97B47" opacity=".9"/>'
+'<g class="ki-fab m-vb" style="transform-origin:262px 58px"><circle cx="262" cy="58" r="22" fill="#E97B47"/><circle cx="262" cy="58" r="8" fill="#FAFAF8"/></g></svg>',

qiflux:'<svg class="m" viewBox="0 0 320 240"><defs><radialGradient id="qfP" cx="28%" cy="26%" r="82%"><stop offset="0" stop-color="#FDF2F1"/><stop offset=".34" stop-color="#E38497"/><stop offset="1" stop-color="#261849"/></radialGradient></defs><g class="qf-breathe m-vb" style="transform-origin:160px 120px"><circle cx="160" cy="120" r="74" fill="url(#qfP)"/></g></svg>',

meishitto:'<svg class="m" viewBox="0 0 320 240"><path d="M36 108 H172 V206 A6 6 0 0 1 166 212 H42 A6 6 0 0 1 36 206 Z" fill="none" stroke="#5254E0" stroke-width="4" opacity=".4"/>'
+'<g class="me-card"><rect x="48" y="60" width="112" height="70" rx="4" fill="#5254E0"/></g>'
+'<g fill="#5254E0"><rect class="me-row" style="animation-delay:.4s" x="192" y="86" width="72" height="12" rx="2"/><rect class="me-row" style="animation-delay:.48s" x="192" y="108" width="58" height="12" rx="2" opacity=".6"/><rect class="me-row" style="animation-delay:.56s" x="192" y="130" width="44" height="12" rx="2" opacity=".34"/></g></svg>',

rythix2048:'<svg class="m" viewBox="0 0 320 240"><defs><linearGradient id="rxN" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2C6DC"/><stop offset="1" stop-color="#BBBBFD"/></linearGradient></defs>'
+'<rect class="rx-a" x="40" y="42" width="56" height="56" rx="4" fill="#F2C6DC"/><rect x="104" y="42" width="56" height="56" rx="4" fill="#BBBBFD"/>'
+'<rect class="rx-b m-vb" x="104" y="42" width="56" height="56" rx="4" fill="url(#rxN)" style="transform-origin:132px 70px"/>'
+'<g fill="url(#rxN)">'
+['0','.05s','.1s','.15s','.2s','.25s','.3s','.35s'].map(function(d,i){return '<rect class="rx-bar" style="animation-delay:'+d+'" x="'+(44+i*34)+'" y="'+(200-(i%3===0?66:i%3===1?46:84))+'" width="18" height="'+(i%3===0?66:i%3===1?46:84)+'" rx="2"/>'}).join('')
+'</g></svg>',

tendo:'<svg class="m" viewBox="0 0 320 240"><path class="td-path m-draw" style="--len:940" d="M62 54 L160 54 L160 118 L62 118 L62 182 L160 182 L258 182 L258 118 L258 54" fill="none" stroke="#C9A961" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>'
+'<g fill="#C9A961">'
+[[62,54],[160,54],[160,118],[62,118],[62,182],[160,182],[258,182],[258,118],[258,54]].map(function(p,i){return '<circle class="td-node" style="animation-delay:'+(i*0.26).toFixed(2)+'s" cx="'+p[0]+'" cy="'+p[1]+'" r="10"/>'}).join('')
+'</g></svg>',

xunni:'<svg class="m" viewBox="0 0 320 240"><defs><radialGradient id="xnG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F4C430" stop-opacity=".22"/><stop offset="1" stop-color="#F4C430" stop-opacity="0"/></radialGradient></defs>'
+'<g class="xn-shell m-vb" style="transform-origin:160px 118px"><circle cx="160" cy="118" r="96" fill="url(#xnG)"/><circle cx="160" cy="118" r="82" fill="none" stroke="#F4C430" stroke-width="1.5" opacity=".5"/></g>'
+'<polygon class="xn-r1" points="160,52 218,104 196,178 124,178 102,104" fill="none" stroke="#F4C430" stroke-width="4"/>'
+'<polygon class="xn-r2" points="160,74 206,112 186,166 132,158 112,98" fill="none" stroke="#F4C430" stroke-width="4"/>'
+'<g fill="#F4C430"><circle cx="112" cy="222" r="4" opacity=".4"/><circle cx="138" cy="222" r="4" opacity=".4"/><circle cx="164" cy="222" r="4" opacity=".4"/><circle cx="190" cy="222" r="4" opacity=".4"/></g>'
+'<circle class="xn-lens" cx="112" cy="222" r="7" fill="#F4C430"/></svg>',

moonpacket:'<svg class="m" viewBox="0 0 320 240"><circle cx="244" cy="58" r="40" fill="#FFBA00"/>'
+'<g class="mp-coin m-vb" style="transform-origin:106px 132px"><circle cx="106" cy="132" r="17" fill="#FFBA00"/></g>'
+'<rect x="56" y="112" width="100" height="112" rx="4" fill="#E32521"/>'

{s:"puritylens",n:"PurityLens",jp:"成分をひと目で",tint:"#EEF4F8",st:"live",plat:["iOS"],

{s:"fudeto",n:"Fudeto",jp:"一筆書き",tint:"#FAFAFA",flat:1,st:"live",plat:["iOS"],

{s:"tendo",n:"Tendo",jp:"一日一道",tint:"#F5F1E8",flat:1,st:"live",plat:["Android"],
 en:{p:"Every point, exactly once.",b:"Fudeto walks edges, which is P — parity of degrees tells you the answer. Tendo walks vertices, which is NP-complete: there is no formula, only intuition and backtracking, and realising that is the aha. Fully playable with Switch Control, with VoiceOver announcing each vertex. Solve it and the Magic Moment runs: 2.4 seconds, every vertex lighting gold in the order you visited it."},

 zh:{p:"每個點，剛好走一次。",b:"Fudeto 走邊，是 P 問題，看度數的奇偶就能判。Tendo 走點，是 NP-complete：沒有通解公式，只能靠直覺與回溯 —— 而「發現沒有公式」本身就是那個啊哈。單開關（Switch Control）可完整遊玩，VoiceOver 會逐頂點朗讀。解開的瞬間跑 2.4 秒的 Magic Moment：每個頂點按你走過的順序依序亮金。"}},

var root=document.documentElement,grid=document.getElementById("grid"),lede=document.getElementById("lede"),legend=document.getElementById("legend");

function render(l){
  lede.textContent=LEDE[l];
  legend.innerHTML=LEGEND[l].map(function(x){return '<span><i class="dot dot--'+x[0]+'"></i>'+x[1]+'</span>'}).join("");
  grid.innerHTML=P.map(function(p){
    var t=p[l];
    var plat=p.plat.length?p.plat.map(function(b){return "<b>"+b+"</b>"}).join(""):'<b class="none">'+(l==="ja"?"未リリース":l==="zh"?"尚未上架":"unreleased")+"</b>";
    var phone=p.nophone?"":'<div class="stage__phone"><i><img src="shots/'+p.s+'.png" alt="'+p.n+' product screen" /></i></div>';
    return '<article class="card"><a class="card__link" href="#" tabindex="0" aria-label="'+p.n+'">'
      +'<div class="stage" style="--tint:'+p.tint+'"'+(p.flat?' data-flat="1"':'')+(p.nophone?' data-nophone="1"':'')+(p.border?' data-border="1"':'')+'>'+M[p.s]+phone+'</div>'
      +'<div class="card__meta"><h3 class="card__name"><em>'+p.n+'</em><i class="dot dot--'+p.st+'"></i></h3>'
      +'<span class="card__jp">'+p.jp+'</span>'
      +'<p class="card__pos">'+t.p+'</p><p class="card__body">'+t.b+'</p>'
      +'<div class="plat">'+plat+'</div></div></a></article>'
  }).join("");
  wire();
}

function wire(){
  var cards=[].slice.call(grid.querySelectorAll(".card"));
  var pending=cards.slice();
  function check(){
    var vh=window.innerHeight;
    for(var i=pending.length-1;i>=0;i--){
      var el=pending[i],r=el.getBoundingClientRect();
      if(r.top<vh*.9&&r.bottom>vh*.05){el.classList.add("is-in");el.querySelector(".stage").classList.add("is-live");pending.splice(i,1)}
    }
  }
  window.addEventListener("scroll",check,{passive:true});
  window.addEventListener("resize",check);
  var t=setInterval(function(){check();if(!pending.length)clearInterval(t)},300);
  check();
  cards.forEach(function(c){
    var link=c.querySelector(".card__link"),stage=c.querySelector(".stage");
    function replay(){stage.classList.remove("is-live");void stage.offsetWidth;stage.classList.add("is-live")}
    link.addEventListener("mouseenter",replay);
    link.addEventListener("focus",replay);
  });
  window.__crzReveal=check;
}

document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click",function(){
    var l=b.dataset.l;
    document.querySelectorAll(".lang button").forEach(function(x){x.setAttribute("aria-selected",String(x===b))});
    root.setAttribute("data-lang",l);
    root.setAttribute("lang",l==="zh"?"zh-Hant":l);
    render(l);
  });
});

render("en");
})();
