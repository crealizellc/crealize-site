<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crealize — Mobile 390 Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #2A2926;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 28px 0;
    box-sizing: border-box;
  }
  .label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(246,245,241,.55);
  }
  .label b { color: #FF4F00; font-weight: 400; }
  .device {
    width: 390px;
    height: min(844px, calc(100vh - 110px));
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(246,245,241,.18), 0 30px 80px rgba(0,0,0,.5);
    background: #FAFAF8;
    flex: none;
  }
  .device iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <p class="label">Crealize — mobile · <b>390 × 844</b> · scroll inside the frame</p>
  <div class="device">
    <iframe src="Crealize Corporate Site.html" title="Crealize mobile preview"></iframe>
  </div>
</body>
</html>
